name: CI (type-check & build)

# Catches a broken build on pull requests before it reaches main.
# Deployment stays in deploy-pages.yml (push to main only).
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check & production build
        run: npm run build

      - name: Report bundle sizes
        if: always()
        run: |
          if [ -d dist/assets ]; then
            echo '### Bundle' >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            ls -l dist/assets | awk 'NR>1 {printf "%10d  %s\n", $5, $9}' >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
